<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>「結」の書き方診断 ｜ 最後の3行が、読者の明日を決めます</title>
<meta name="description" content="起承転結の「結」＝文章の締め方を10問で診断します。4タイプ判定と、明快さ・接続・余白の3要素スコア、そのまま使える締めのテンプレートをお渡しします。">
<link rel="canonical" href="https://daisukenaka.github.io/yui/">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1319" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="「結」の書き方診断">
<meta property="og:title" content="「結」の書き方診断 ｜ 最後の3行が、読者の明日を決めます">
<meta property="og:description" content="本文は読まれている。それでも何も起きないのは、たいてい最後の数行のせいです。10問で、あなたの締め方の型と穴が分かります。">
<meta property="og:url" content="https://daisukenaka.github.io/yui/">
<meta property="og:image" content="https://daisukenaka.github.io/yui/ogp/yui-top-v1.png">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta property="og:image:alt" content="「結」の書き方診断">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="「結」の書き方診断">
<meta name="twitter:description" content="本文は読まれている。それでも何も起きないのは、たいてい最後の数行のせいです。">
<meta name="twitter:image" content="https://daisukenaka.github.io/yui/ogp/yui-top-v1.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c8453c'/%3E%3Ctext x='32' y='47' font-size='40' text-anchor='middle' fill='%23fff' font-family='serif'%3E%E7%B5%90%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <!-- ========== 導入 ========== -->
  <section id="intro" aria-labelledby="intro-title">
    <div id="resume-host"></div>
    <div class="seal" aria-hidden="true" style="margin:0 0 26px">結</div>
    <p class="kicker">Writing Diagnosis</p>
    <h1 id="intro-title">「結」の書き方診断</h1>
    <p class="sub" id="c-subtitle"></p>
    <p class="hook" id="c-hook"></p>

    <p class="block-title">この診断で分かること</p>
    <ul class="list" id="c-promise"></ul>

    <hr class="rule">

    <p class="block-title">こんな方へ</p>
    <ul class="list" id="c-whofor"></ul>

    <div class="start-wrap">
      <button class="btn" id="start" type="button">10問に答える（約3分）</button>
      <p class="note" style="margin-top:12px;text-align:center" id="c-privacy"></p>
    </div>

    <div class="author" id="c-author"></div>
  </section>

  <!-- ========== 属性設問（スコア非算入） ========== -->
  <section id="gate" hidden aria-labelledby="g-text">
    <p class="kicker">はじめに</p>
    <p class="scene" id="g-scene"></p>
    <h2 class="qtext" id="g-text" tabindex="-1"></h2>
    <div class="opts" id="g-opts" role="group" aria-labelledby="g-text"></div>
    <p class="note" style="margin-top:18px">この回答はタイプ判定にも結スコアにも影響しません。お返しする内容を合わせるためだけに伺っています。</p>
  </section>

  <!-- ========== 設問 ========== -->
  <section id="quiz" hidden>
    <div class="qbar">
      <div class="qbar-top">
        <button class="qback" id="q-back" type="button">← ひとつ戻る</button>
        <span class="qcount"><b id="q-now">1</b> <span aria-hidden="true">/</span> <span id="q-total">10</span></span>
      </div>
      <div class="segs" id="q-segs" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" aria-label="回答の進捗"></div>
    </div>
    <div class="stage" id="q-stage">
      <p class="scene" id="q-scene"></p>
      <h2 class="qtext" id="q-text" tabindex="-1"></h2>
      <div class="opts" id="q-opts" role="group" aria-labelledby="q-text"></div>
    </div>
  </section>

  <!-- ========== 結果 ========== -->
  <section id="result" hidden aria-labelledby="r-name"></section>
</main>

<footer id="site-footer"></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
